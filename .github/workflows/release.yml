name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          LATEST=$(ls /Applications/ | grep -E "^Xcode_[0-9]" | sort -t_ -k2 -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "/Applications/$LATEST"
          swift --version

      - name: Install Swift 6.2 if needed
        run: |
          TOOLS=$(swift package tools-version 2>/dev/null || echo "0.0")
          SWIFT=$(swift --version 2>&1 | grep -oE 'Swift version [0-9]+\.[0-9]+' | awk '{print $3}')
          echo "Swift $SWIFT detected"
          # Our deps need Swift 6.2; install it if the Xcode toolchain is older
          if [[ "$(printf '%s\n' '6.2' "$SWIFT" | sort -V | head -1)" != "6.2" ]]; then
            echo "Swift < 6.2, installing 6.2 toolchain..."
            curl -fsSL https://download.swift.org/swift-6.2-release/xcode/swift-6.2-RELEASE/swift-6.2-RELEASE-osx.pkg -o /tmp/swift.pkg
            sudo installer -pkg /tmp/swift.pkg -target /
            export PATH="/Library/Developer/Toolchains/swift-latest.xctoolchain/usr/bin:$PATH"
            echo "PATH=/Library/Developer/Toolchains/swift-latest.xctoolchain/usr/bin:$PATH" >> $GITHUB_ENV
            swift --version
          fi

      - name: Build app
        run: Scripts/build-app.sh release

      - name: Zip app
        run: |
          cd build
          zip -r "GroundControl-${{ github.ref_name }}.zip" "Ground Control.app"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "Ground Control ${{ github.ref_name }}"
          draft: false
          files: build/GroundControl-${{ github.ref_name }}.zip
          body: |
            ## Install

            1. Download `GroundControl-${{ github.ref_name }}.zip` below
            2. Unzip and move `Ground Control.app` to `/Applications`
            3. First launch: right-click → Open (bypasses Gatekeeper for ad-hoc signed apps)

            Requires macOS 14+ and the [Claude Code CLI](https://claude.ai/code).
