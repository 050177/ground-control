name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build app
        run: Scripts/build-app.sh release

      - name: Zip app
        run: |
          cd build
          zip -r "GroundControl-${{ github.ref_name }}.zip" "Ground Control.app"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "Ground Control ${{ github.ref_name }}"
          draft: false
          files: build/GroundControl-${{ github.ref_name }}.zip
          body: |
            ## Install

            1. Download `GroundControl-${{ github.ref_name }}.zip` below
            2. Unzip and move `Ground Control.app` to `/Applications`
            3. First launch: right-click → Open (bypasses Gatekeeper for ad-hoc signed apps)

            Requires macOS 14+ and the [Claude Code CLI](https://claude.ai/code).
